[project]
name = "toriq-api"
version = "0.1.0"
description = "Backend FastAPI do TORIQ"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.7",
    "passlib[argon2]>=1.7.4",
    "pyjwt>=2.10",
    "python-multipart>=0.0.20",
    "pydantic[email]>=2.13.4",
    "apscheduler>=3.11.2",
    "tzdata>=2026.2",
    "boto3>=1.43.28",
    "cryptography>=49.0.0",
    "httpx>=0.28",
    "redis>=5.2",
    "pyhanko>=0.35.1",
    "pypdf>=6.13.2",
    "reportlab>=4.5.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "aiosqlite>=0.20",
    "sqlacodegen>=4.0.3",
    "psycopg[binary]>=3.3.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = false
